name: Build, prerender and deploy

on:
  push:
    # main = live site; seo-rebuild = test deploy on a preview address
    branches: [main, seo-rebuild]
  # Picks up CMS edits (prices, offers, doctors, pages) every 6 hours.
  schedule:
    - cron: "15 */6 * * *"
  # "Run workflow" button in GitHub > Actions, for publishing CMS edits immediately.
  workflow_dispatch:
  # Lets an external trigger (e.g. a Supabase webhook) publish CMS edits.
  repository_dispatch:
    types: [cms-update]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Supabase URL and public (anon) key come from the committed .env file.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Prerender pages to static HTML
        run: node scripts/prerender.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create kundalini-dental --production-branch=main || true
          npx --yes wrangler@3 pages deploy dist --project-name=kundalini-dental --branch="${GITHUB_REF_NAME}" --commit-dirty=true
